name: Validação de Estrutura das Skills (CI)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-structure:
    name: validate-structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          # Wheel CPython 3.12/Linux x86_64 conferido no PyPI; sem builds de fontes.
          printf '%s\n' 'PyYAML==6.0.2 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476' \
            | python -I -m pip install --require-hashes --only-binary=:all: -r /dev/stdin

      - name: Testar fronteiras e falhas do validador
        run: python -m unittest discover -s scripts -p 'test_check_skills.py' -v

      - name: Executar Validador Estrutural de Skills
        run: |
          python scripts/check_skills.py --root . --github-summary
